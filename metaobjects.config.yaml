# What `metaobjects gen` and `metaobjects verify --codegen` run, with no flags.
#
# The model is under metaobjects/ and the generators are this repository's own, under
# metagen/. The generated files are committed, with .metaobjects/.gen-state/.hashes.json
# beside them: that manifest is how a hand edit is told from generated output.
#
#   uvx --python 3.12 --from metaobjects==1.0.13 metaobjects gen      # regenerate
#   scripts/ci-local.sh --only model                                  # the drift check
#
# The toolchain needs Python 3.11 or newer, which is why it runs under `uvx` and is in
# no dependency list: nothing generated imports it, and the package floor is unmoved.
metadata: metaobjects
targets:
  # Ships in the wheel: the column vocabularies the commands read.
  package:
    outDir: src/plex_axi/model
    generators: ["metagen:rows"]
  # Test support: the double's element builders and the capture check.
  tests:
    outDir: tests/plexmodel
    generators: ["metagen:elements", "metagen:capture_contract"]
