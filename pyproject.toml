[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "plex-axi"
version = "0.5.0"
description = "Agent eXperience Interface (AXI) CLI for structured, per-field music search against a Plex Media Server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
  "plex",
  "plex-media-server",
  "music",
  "music-library",
  "cli",
  "axi",
  "agent",
  "agent-skills",
  "llm",
  "toon",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
  # The model layer is the point. plexapi carries MusicSection, the filter DSL
  # and its server-side validation; a transport-only SDK carries none of it.
  #
  # This pin sets `requires-python` above: plexapi 4.18.0 dropped Python 3.9,
  # so raising this minimum can raise the floor without mentioning it. Keep the
  # two in step -- `tests/test_python_floor.py` checks the floor against the CI
  # matrix, but only an install on the oldest version proves the pin is
  # satisfiable there.
  "PlexAPI>=4.18",
  # The `plex://` forms and the music filter language live here now, with the
  # error contract they raise against and the renderer that puts this tool's
  # name back in front of a recovery. 0.4.0 is the first release carrying
  # `axi_toolkit.plex`, so it is the floor. The package declares no runtime
  # dependency of its own and publishes `requires-python >= 3.9`, so it neither
  # brings anything transitive with it nor has any say in the floor above.
  "axi-toolkit>=0.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  # The pull request leak scan is only a guard if the workflow actually runs it
  # on the trigger that matters, so tests/test_leakcheck.py parses hygiene.yml
  # into what GitHub will run rather than matching it as text.
  "pyyaml>=6",
  "ruff>=0.5",
]

[project.scripts]
plex-axi = "plex_axi.cli:main"

# PyPI renders these as the sidebar links on the project page, so each one is a
# route out of a page a stranger landed on with no other context.
[project.urls]
Homepage = "https://github.com/dmealing/plex-axi"
Source = "https://github.com/dmealing/plex-axi"
Documentation = "https://github.com/dmealing/plex-axi#readme"
Changelog = "https://github.com/dmealing/plex-axi/blob/main/CHANGELOG.md"
Issues = "https://github.com/dmealing/plex-axi/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/plex_axi"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:plex_axi.*"]
